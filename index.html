<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>小暖炉</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  /* Layout: one narrow column built around a thermometer that cools as she taps "drink warm water". */
  :root {
    --bg: #eef3f2;
    --surface: #f8fbfa;
    --fg: #1e2d2f;
    --muted: #566a6c;
    --line: #cddad8;
    --accent: #e0892b;
    --accent-ink: #2a1700;
    --hot: #e2674f;
    --ok: #2f9c8c;
    --font-display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1b1d;
      --surface: #162528;
      --fg: #e6f0ee;
      --muted: #93a9a8;
      --line: #28403f;
      --accent: #f2a649;
      --accent-ink: #2a1700;
      --hot: #f07b63;
      --ok: #4cc2b0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1b1d;
    --surface: #162528;
    --fg: #e6f0ee;
    --muted: #93a9a8;
    --line: #28403f;
    --accent: #f2a649;
    --accent-ink: #2a1700;
    --hot: #f07b63;
    --ok: #4cc2b0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.7;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 440px; margin: 0 auto; display: grid; gap: 20px; }

  .eyebrow { margin: 0; font-size: 13px; letter-spacing: 0.12em; color: var(--muted); }
  h1 {
    margin: 4px 0 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 2rem;
    line-height: 1.25;
    text-wrap: balance;
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  .stage {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr);
    gap: 16px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
  }
  .thermo { display: block; width: 120px; height: 320px; max-width: 100%; }
  .thermo .tube { fill: var(--bg); stroke: var(--line); stroke-width: 2; }
  .thermo .tick { stroke: var(--muted); stroke-width: 1.5; }
  .thermo .lbl { fill: var(--muted); font-size: 13px; font-family: var(--font-body); }
  .thermo .goal { stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .thermo .goal-lbl { fill: var(--ok); font-size: 12px; font-weight: 700; font-family: var(--font-body); }
  .thermo .hg { fill: var(--hot); transition: fill .4s; }
  .thermo.cool .hg { fill: var(--ok); }
  .thermo .col {
    transform-box: fill-box;
    transform-origin: bottom;
    transition: transform .6s cubic-bezier(.3,.7,.2,1);
  }

  .readout { min-width: 0; display: grid; gap: 10px; align-content: center; }
  .temp {
    font-family: var(--font-display);
    font-size: 3.6rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .temp small { font-family: var(--font-body); font-size: 1.1rem; color: var(--muted); }
  .temp.bump { animation: bump .35s ease; }
  @keyframes bump { 50% { transform: scale(1.06); } }
  .pill {
    justify-self: start;
    padding: 2px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-ink);
    background: var(--hot);
  }
  .pill.cool { background: var(--ok); }
  .count { margin: 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .6s ease; }

  .sip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    min-height: 60px;
    border: 0;
    border-radius: 16px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 700 1.1rem var(--font-body);
    cursor: pointer;
  }
  .sip:active { transform: translateY(1px); }
  .sip:focus-visible, .again:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .sip[hidden] { display: none; }
  .sip svg { width: 34px; height: 34px; }
  .steam { stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; animation: rise 2.4s ease-in-out infinite; }
  .steam:nth-of-type(2) { animation-delay: .5s; }
  .steam:nth-of-type(3) { animation-delay: 1s; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(4px); }
    40% { opacity: .9; }
    100% { opacity: 0; transform: translateY(-5px); }
  }

  .note {
    margin: 0;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    min-height: 4.6em;
    display: flex;
    align-items: center;
    font-size: 1.05rem;
  }
  .again {
    justify-self: center;
    background: none;
    border: 0;
    color: var(--muted);
    font: 500 14px var(--font-body);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 8px 12px;
  }

  .meet {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .meet p { margin: 0; }
  .meet .when { color: var(--muted); font-size: 14px; }
  .meet .days { font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .fine { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .steam, .temp.bump { animation: none; }
    .thermo .col, .bar i { transition: none; }
  }
</style>

<main>
  <header>
    <p class="eyebrow">给秦梦瑶</p>
    <h1>把体温调回 36.6°C</h1>
    <p class="sub">每做一件对身体好的事，降 0.2°C。点十下就好。</p>
  </header>

  <section class="stage" aria-label="体温计">
    <svg class="thermo" id="thermo" viewBox="0 0 120 320" role="img" aria-label="体温计，36 到 39 摄氏度">
      <rect class="tube" x="31" y="30" width="18" height="255" rx="9"/>
      <rect class="hg col" id="col" x="34" y="40" width="12" height="245" rx="6"/>
      <circle class="hg" cx="40" cy="285" r="22"/>
      <g>
        <line class="tick" x1="54" y1="250" x2="64" y2="250"/><text class="lbl" x="70" y="255">36</text>
        <line class="tick" x1="54" y1="180" x2="64" y2="180"/><text class="lbl" x="70" y="185">37</text>
        <line class="tick" x1="54" y1="110" x2="64" y2="110"/><text class="lbl" x="70" y="115">38</text>
        <line class="tick" x1="54" y1="40" x2="64" y2="40"/><text class="lbl" x="70" y="45">39</text>
      </g>
      <line class="goal" x1="20" y1="208" x2="64" y2="208"/>
      <text class="goal-lbl" x="70" y="212">36.6</text>
    </svg>

    <div class="readout">
      <div class="temp" id="temp" aria-live="polite"><span id="tempNum">38.6</span><small>°C</small></div>
      <span class="pill" id="pill">还在发烧</span>
      <p class="count" id="count">第 0 / 10 步</p>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    </div>
  </section>

  <button class="sip" id="sip" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 41C10 31 6 24 6 17a9 9 0 0 1 18-3 9 9 0 0 1 18 3c0 7-4 14-18 24z" fill="currentColor"/>
    </svg>
    <span id="sipLabel">喝些温水</span>
  </button>

  <p class="note" id="note" aria-live="polite">先喝一口温水，不用着急。</p>
  <button class="again" id="again" type="button" hidden>再玩一次</button>

  <p class="fine">游戏里的体温是假的，真实体温以体温计和医生的判断为准。</p>
</main>

<script>
(function () {
  var START = 386, STEP = 2, TOTAL = 10; // tenths of a degree
  var KEY = "xiaonuanlu-n";
  var msgs = [
    "不用急，我们一步一步来，你只管慢慢好起来。",
    "疼的时候想哭就哭一会儿，我不会笑你，只会心疼你。",
    "虽然“没关系”“没事哒”已经说了很多遍，但真心的，秦梦瑶一定会好起来的。",
    "恢复过程特别痛苦，也很慢，但身边的室友、我、家人都在的^_^",
    "你的身体不差，任何一个人得了都会这样，即便是我。",
    "不用自责，这都素🦠太坤坤毒了！",
    "驱散臭🦠，身体好好哒！",
    "然后都健健康康哒！",
    "有没有感觉到好像身体暖暖的，在好起来了？",
    "快到啦，你已经很勇敢了，我为你骄傲。",
    "36.6°C，通关。宝宝痊愈了，我们好好哒、高高兴兴哒玩游戏，玩任何想玩的o(^▽^)o"
  ];
  var acts = [
    "喝些温水", "吃点药", "睡一个好觉", "走走停停", "相信自己",
    "刷到开心的视频", "和我说说话、吐吐苦水", "听一首喜欢的歌", "和室友聊聊天", "想一件开心的事"
  ];
  var n = 0;
  try { n = Math.min(TOTAL, Math.max(0, parseInt(localStorage.getItem(KEY), 10) || 0)); } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var thermo = $("thermo"), col = $("col"), temp = $("temp"), tempNum = $("tempNum"),
      pill = $("pill"), count = $("count"), bar = $("bar"), sip = $("sip"),
      note = $("note"), again = $("again");

  function render(animate) {
    var t10 = START - n * STEP;
    var t = t10 / 10;
    tempNum.textContent = t.toFixed(1);
    var s = (35 + (t - 36) * 70) / 245;
    col.style.transform = "scaleY(" + s.toFixed(4) + ")";
    var cool = t10 < 373;
    thermo.classList.toggle("cool", cool);
    pill.classList.toggle("cool", cool);
    pill.textContent = n >= TOTAL ? "体温正常" : (cool ? "快好了" : "还在发烧");
    count.textContent = "第 " + n + " / " + TOTAL + " 步";
    bar.style.width = (n / TOTAL * 100) + "%";
    note.textContent = msgs[n];
    $("sipLabel").textContent = acts[Math.min(n, acts.length - 1)];
    var done = n >= TOTAL;
    sip.hidden = done;
    again.hidden = !done;
    if (animate) {
      temp.classList.remove("bump");
      void temp.offsetWidth;
      temp.classList.add("bump");
    }
  }
  function save() { try { localStorage.setItem(KEY, String(n)); } catch (e) {} }

  sip.addEventListener("click", function () {
    if (n < TOTAL) { n += 1; save(); render(true); }
  });
  again.addEventListener("click", function () { n = 0; save(); render(true); });

  render(false);
})();
</script>

</body></html>
